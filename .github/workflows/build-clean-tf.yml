name: Build installable release (clean-tf-7.2)

# Builds everything a computer needs to install Linux on an F50/MU300/U30 Air from this
# branch: the vendor 5.4 kernel + modules, mainline 6.18/7.2, the Ubuntu and OpenWrt root
# filesystems, the Windows installer GUI and the assembled release assets.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vYYYY.MM.DD-<suffix>)'
        required: true
        default: 'v2026.10.16-clean-tf.1'
      kv618:
        description: 'mainline 6.18.x to build'
        required: true
        default: '6.18.54'
      kv72:
        description: 'mainline 7.2.x to build'
        required: true
        default: '7.2.8'
      publish:
        description: 'Create/update the GitHub release in this repository'
        type: boolean
        default: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  vendor:
    name: Vendor 5.4 kernel and modules
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lz4 xz-utils python3 rsync unzip zip cpio
          sudo python3 -m pip install -q lz4 || sudo python3 -m pip install -q --break-system-packages lz4
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          df -h / | tail -1
      # docker writes the outputs as root: the script's own cleanup (rm -rf of a directory a container filled)
      # fails for anyone else, which is how the first run of this workflow failed. Everything runs as root.
      - name: Build kernel/build-all.sh
        run: sudo -E env MU300_KERNEL_OUT="$PWD/out" sh kernel/build-all.sh
      - name: Summary
        run: |
          ls -la out/ | head -20
          echo "modules: $(ls out/modules/*.ko | wc -l), u30air: $(ls out/modules-u30air/*.ko | wc -l)"
          strings out/Image | grep -m1 '^Linux version'
      - uses: actions/upload-artifact@v4
        with:
          name: vendor-out
          path: out/
          if-no-files-found: error
          compression-level: 0

  mainline:
    name: Mainline ${{ matrix.kv }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - kv: '6.18'
            outdir: out
          - kv: '7.2'
            outdir: out-7.2
    steps:
      - uses: actions/checkout@v4
      - name: Build environment
        run: |
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          sudo -E docker build -t mu300-mainline-build upstream/
      - name: Kernel ${{ matrix.kv }}
        env:
          KV: ${{ matrix.kv == '6.18' && inputs.kv618 || inputs.kv72 }}
          OUTDIR: ${{ matrix.outdir }}
        run: |
          sudo -E docker volume create mu300-mainline-${{ matrix.outdir }}
          sudo -E docker run --rm -e KV="$KV" -e OUTDIR="$OUTDIR" \
            -v mu300-mainline-${{ matrix.outdir }}:/src -v "$PWD/upstream":/work \
            mu300-mainline-build bash /work/build.sh
      - name: Vendor modules ${{ matrix.kv }}
        env:
          KV: ${{ matrix.kv == '6.18' && inputs.kv618 || inputs.kv72 }}
          OUTDIR: ${{ matrix.outdir }}
        run: |
          sudo -E docker run --rm -e KV="$KV" -e OUTDIR="$OUTDIR" \
            -v mu300-mainline-${{ matrix.outdir }}:/src -v "$PWD/upstream":/work \
            mu300-mainline-build bash /work/build-modules.sh
      - name: Summary
        run: |
          strings upstream/${{ matrix.outdir }}/Image | grep -m1 '^Linux version'
          echo "modules: $(ls upstream/${{ matrix.outdir }}/modules/*.ko | wc -l)"
      - name: Build logs on failure
        if: failure()
        run: tail -n 80 upstream/${{ matrix.outdir }}/*.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: mainline-${{ matrix.outdir }}
          path: upstream/${{ matrix.outdir }}/
          if-no-files-found: error
          compression-level: 0

  gui:
    name: Windows installer GUI
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: installer/ui/package-lock.json
      - name: Rust build toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Python build dependencies
        run: python -m pip install pyinstaller paramiko lz4
      - name: Build portable release
        run: python installer/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: gui-windows
          path: installer/artifacts/windows/
          if-no-files-found: error

  release:
    name: Assemble release assets
    needs: [vendor, mainline]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lz4 xz-utils python3 rsync unzip zip cpio
          sudo python3 -m pip install -q lz4 || sudo python3 -m pip install -q --break-system-packages lz4
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          docker version --format 'docker {{.Server.Version}} {{.Server.Arch}}'
          df -h / | tail -1
      - uses: actions/download-artifact@v4
        with:
          name: vendor-out
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: mainline-out
          path: upstream/out
      - uses: actions/download-artifact@v4
        with:
          name: mainline-out-7.2
          path: upstream/out-7.2
      - name: Build release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MU300_REPO: ${{ github.repository }}
        run: |
          set -x
          sudo -E git status --porcelain
          if [ "${{ inputs.publish }}" = "true" ]; then
            sudo -E sh tools/make-release.sh "${{ inputs.tag }}" --publish
          else
            sudo -E sh tools/make-release.sh "${{ inputs.tag }}"
          fi
      - name: Free space before upload
        run: docker system prune -af >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            release/${{ inputs.tag }}/*.tar.gz
            release/${{ inputs.tag }}/mu300-update
            release/${{ inputs.tag }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
